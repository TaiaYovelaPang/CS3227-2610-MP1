import java.util.Locale

plugins { id 'application' }

repositories { mavenCentral() }

def javafxVersion = '25.0.2'
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def architecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def arm64 = architecture.contains('aarch64') || architecture.contains('arm64')
def javafxPlatform = osName.contains('mac') ? (arm64 ? 'mac-aarch64' : 'mac') :
        (osName.contains('win') ? 'win' : (arm64 ? 'linux-aarch64' : 'linux'))

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation,unchecked', '-Werror'])
}

dependencies {
    implementation "org.openjfx:javafx-base:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-graphics:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-controls:${javafxVersion}:${javafxPlatform}"
    implementation "org.openjfx:javafx-swing:${javafxVersion}:${javafxPlatform}"
}

application { mainClass = 'teamsync.TeamSyncLauncher' }

def releasePlatforms = [
        'windows-x64'  : 'win',
        'macos-x64'    : 'mac',
        'macos-aarch64': 'mac-aarch64',
        'linux-x64'    : 'linux',
        'linux-aarch64': 'linux-aarch64'
]

def platformJarTasks = releasePlatforms.collectEntries { platformName, classifier ->
    def capitalisedName = platformName.split('-').collect { it.capitalize() }.join('')
    def configurationName = "javafx${capitalisedName}"
    def platformConfiguration = configurations.create(configurationName) {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    ['base', 'graphics', 'controls', 'swing'].each { moduleName ->
        dependencies.add(configurationName,
                "org.openjfx:javafx-${moduleName}:${javafxVersion}:${classifier}")
    }

    def platformJar = tasks.register("${platformName}RuntimeJar", Jar) {
        archiveFileName = "${platformName}.jar"
        destinationDirectory = layout.buildDirectory.dir('teamsync-platforms')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest { attributes 'Main-Class': application.mainClass.get() }

        dependsOn tasks.named('classes')
        from sourceSets.main.output
        from {
            platformConfiguration.collect { dependency ->
                dependency.directory ? dependency : zipTree(dependency)
            }
        }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    [(platformName): platformJar]
}

tasks.register('releaseJar', Jar) {
    group = 'distribution'
    description = 'Builds one self-contained TeamSync bootstrap JAR for all supported platforms.'
    archiveFileName = 'teamsync.jar'
    destinationDirectory = layout.projectDirectory.dir('release')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'teamsync.TeamSyncBootstrap' }

    dependsOn platformJarTasks.values()
    from(sourceSets.main.output) {
        include 'teamsync/TeamSyncBootstrap.class'
    }
    from(platformJarTasks.values()) {
        into 'META-INF/teamsync/platforms'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def java25 = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('run', JavaExec) {
    javaLauncher = java25
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = 'Runs TeamSync dependency-free regression checks.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'teamsync.TeamSyncSelfTest'
    javaLauncher = java25
}
